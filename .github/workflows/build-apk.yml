name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить Capacitor
        run: npm install

      - name: Создать Android-проект
        run: |
          npx cap add android
          npx cap sync android

      - name: Разрешение на вибрацию
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Значок приложения
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icons/res/* android/app/src/main/res/

      - name: Постоянная подпись
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Собрать APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: dnevnik-zala-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Выложить APK по постоянной ссылке
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dnevnik-zala.apk
          PLUGINS=$(cat android/app/src/main/assets/capacitor.plugins.json | tr -d '\n ')
          VIB=$(grep -c "android.permission.VIBRATE" android/app/src/main/AndroidManifest.xml || true)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dnevnik-zala.apk --title "Дневник зала — последняя версия" --notes "Собрано $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M'). Открой эту страницу с телефона и нажми dnevnik-zala.apk, чтобы скачать и установить. Плагины: $PLUGINS. Вибрация: $VIB" --latest
