<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник зала</title>
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник зала">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone column — sticky date bar on top, group "plates" as cards, tab bar fixed at bottom */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#141c26; --muted:#5b6876; --line:#d5dce4;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --accent-ink:#ffffff;
  --good:#17804b; --good-soft:#dff3e8; --warm:#a86508; --warm-soft:#fbefd9; --danger:#c0322f;
  --p-red:#d43c3c; --p-blue:#2457d6; --p-yellow:#dcae17; --p-green:#2c9a55; --p-grey:#7d8794;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --surface:#172028; --surface-2:#1d2731; --ink:#e6ecf2; --muted:#93a0ad; --line:#2a3541;
  --accent:#7193ff; --accent-soft:#1f2c4d; --accent-ink:#0a1020;
  --good:#4fc68a; --good-soft:#163527; --warm:#e6aa4f; --warm-soft:#3a2b14; --danger:#ff6b66;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --surface:#172028; --surface-2:#1d2731; --ink:#e6ecf2; --muted:#93a0ad; --line:#2a3541;
  --accent:#7193ff; --accent-soft:#1f2c4d; --accent-ink:#0a1020;
  --good:#4fc68a; --good-soft:#163527; --warm:#e6aa4f; --warm-soft:#3a2b14; --danger:#ff6b66;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.01em;margin:0}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good)}
.daterow{display:flex;align-items:center;gap:8px}
.daterow .nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.datebox{flex:1;min-width:0;position:relative;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.datebox .today{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px 8px;display:flex;flex-direction:column;gap:12px}

/* summary strip */
.summary{display:flex;align-items:center;gap:12px}
.meter{flex:1;display:grid;gap:4px;grid-template-columns:repeat(var(--n),1fr)}
.meter i{height:8px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--good)}
.summary b{font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap}

/* group card */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.group.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ghead{display:flex;align-items:center;gap:10px}
.plate{width:22px;height:22px;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--pc) 70%,#000 0%),inset 0 0 0 7px var(--surface);position:relative}
.plate::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ghead h2{font-size:15px;font-weight:700;margin:0;flex:1;min-width:0}
.ghead .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ghead .check{color:var(--good);font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;line-height:1.2}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* logger */
.log{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.log h3{margin:0;font-size:14px;font-weight:700}
.rec{border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.rec .last{color:var(--muted)}
.rec .last span,.rec .goal span{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.rec .goal{font-weight:600}
.rec.up{background:var(--good-soft)} .rec.up .goal{color:var(--good)}
.rec.hold{background:var(--warm-soft)} .rec.hold .goal{color:var(--warm)}
.rec.new .goal{color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr auto 1fr 34px;align-items:center;gap:6px}
.set .n{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.set .n.wu{color:var(--warm)}
.set .x{color:var(--muted);font-size:13px}
.fld{position:relative;min-width:0}
.fld input{width:100%;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center;padding:0 30px 0 8px;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.fld input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.fld small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set .del{width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:8px}
.set.wurow .fld input{border-style:dashed}
.addset{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:9px;padding:7px 12px;font-size:13px;color:var(--accent);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 8px}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sec-title{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.02em;margin:4px 2px 0;color:var(--muted);text-transform:uppercase}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow h3{margin:0;font-size:15px;font-weight:700}
.hrow h3 em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines span:last-child{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.lines span:first-child{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* exercises editor */
.exrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow:last-of-type{border-bottom:0}
.exrow span{min-width:0}
.exrow .rm{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}

/* progress */
.sel{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--f-num);font-size:17px;font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:none;border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.chip,.tab,.meter i{transition:background-color .15s,color .15s,border-color .15s}}
.setgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.setgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.setgrid input{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center;width:100%}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card textarea{width:100%;min-height:90px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:12px;padding:8px;resize:vertical}
.msg{font-size:13px;font-weight:600}
.msg.ok{color:var(--good)} .msg.err{color:var(--danger)}
.progpick{display:flex;flex-direction:column;gap:6px}
.progpick .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chip.big{padding:9px 16px;font-size:14.5px;font-weight:600}
.hint.left{text-align:left;padding:0 2px;margin:0}
.nameinp{flex:1;min-width:0;height:40px;border-radius:9px;border:1px solid transparent;background:var(--surface-2);padding:0 10px;font-size:15px;font-weight:700}
.nameinp:focus{border-color:var(--accent);background:var(--surface);outline:none}
.slothead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
.slots{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sname{flex:1;min-width:0;font-size:14px;font-weight:500}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--surface-2);font-size:16px;font-weight:600}
.stepper b{min-width:26px;text-align:center;font-family:var(--f-num);font-size:14px}
.mv{display:inline-flex;gap:2px}
.mv button,.slot .x2{width:30px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:15px}
.stepper button:disabled,.mv button:disabled{opacity:.3;cursor:default}
.sel.small{height:38px;font-weight:500;color:var(--accent)}
.gcard{padding:0;gap:0}
.gcard summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;font-weight:700}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary .gsum{flex:1;min-width:0}
.gcard summary em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:600}
.gcard summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.gcard[open] summary::after{transform:rotate(90deg)}
.gbody{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.sumlink{font-size:13px;color:var(--muted);cursor:pointer}
.col{display:flex;flex-direction:column;gap:6px;margin-top:8px;align-items:flex-start}
.card.warn{border-color:var(--danger)}
.card.warn b{color:var(--ink)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Дневник зала</h1><span class="status" id="status">Загрузка…</span></div>
  <div class="daterow" id="daterow">
    <button class="nav" id="prevDay" aria-label="Предыдущий день">‹</button>
    <label class="datebox"><span id="dateLabel">—</span><span class="today" id="todayTag" hidden>сегодня</span><input type="date" id="dateInput" aria-label="Дата тренировки"></label>
    <button class="nav" id="nextDay" aria-label="Следующий день">›</button>
  </div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs"><div class="wrap">
  <button class="tab on" data-tab="workout"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Тренировка</button>
  <button class="tab" data-tab="history"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>История</button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Прогресс</button>
  <button class="tab" data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Настройки</button>
</div></nav>

<script>
(function(){
"use strict";
var IS_ARTIFACT = false;
var REP_LO = 10, REP_HI = 12, SETS = 3;
var PLATES = ["--p-red","--p-blue","--p-yellow","--p-green","--p-grey"];

/* ---------- стартовая библиотека ---------- */
function G(id,name,ex){return {id:id,name:name,ex:ex.map(function(e){return {id:e[0],name:e[1]};})};}
var DEFAULT_GROUPS = [
  G("q","Квадрицепс",[["q1","Жим ногами"],["q2","Разгибание ног"],["q3","Зашагивания"]]),
  G("g","Ягодицы",[["g1","Ягодичный мост"],["g2","Гиперэкстензия"],["g3","Отведение ноги назад"]]),
  G("h","Задняя поверхность бедра",[["h1","Сгибание ног"],["h2","Румынская тяга"]]),
  G("l","Ноги, дополнительно",[["l1","Отведение бёдер"],["l2","Сведение бёдер"]]),
  G("b","Спина",[["b1","Тяга верхнего блока"],["b2","Рычажная тяга"],["b3","Тяга гантели одной рукой"],["b4","Тяга штанги"],["b5","Тяга горизонтального блока"]]),
  G("c","Грудь",[["c1","Жим гантелей"],["c2","Бабочка"],["c3","Разводка гантелей"],["c4","Отжимания"]]),
  G("s","Плечи",[["s1","Армейский жим"],["s2","Жим гантелей сидя"],["s3","Махи в стороны"],["s4","Отведение на блоке"],["s5","Обратная бабочка"],["s6","Тяга каната к лицу"]]),
  G("m","Мини-блок",[["m1","Трицепс"],["m2","Икры"],["m3","Пресс"]]),
  G("bi","Бицепс",[["bi1","Сгибания с гантелями сидя"],["bi2","Молотки"],["bi3","Сгибания на скамье Скотта"],["bi4","Сгибания на нижнем блоке"]]),
  G("tr","Трицепс",[["tr1","Разгибания на верхнем блоке"],["tr2","Французский жим с гантелями"],["tr3","Разгибание гантели из-за головы"],["tr4","Отжимания узким хватом"]]),
  G("ca","Икры",[["ca1","Подъёмы на носки сидя"],["ca2","Подъёмы на носки в тренажёре"],["ca3","Подъёмы на носки на одной ноге"]]),
  G("ab","Пресс",[["ab1","Планка"],["ab2","Боковая планка"],["ab3","Мёртвый жук"],["ab4","Паллоф-пресс"],["ab5","Скручивания"]])
];
function P(id,name,slots){return {id:id,name:name,slots:slots.map(function(s){return {gid:s[0],count:s[1]||1};})};}
var DEFAULT_PROGRAMS = [
  P("p_full","Фулбади",[["q"],["g"],["h"],["l"],["b"],["c"],["s"],["m",3]]),
  P("p_up","Верх",[["b",2],["c"],["s"],["bi"],["tr"]]),
  P("p_low","Низ",[["q"],["g"],["h"],["l"],["ca"],["ab"]])
];
function defaultConfig(){return {version:2,settings:{repLo:10,repHi:12,sets:3},groups:clone(DEFAULT_GROUPS),programs:clone(DEFAULT_PROGRAMS),lastProgram:"p_full"};}

/* Старые данные (версия 1): группы с полем multi и без программ. */
function migrate(cfg){
  if(!cfg||!cfg.groups)return defaultConfig();
  cfg=clone(cfg);
  if(cfg.version>=2&&cfg.programs)return cfg;
  var old=cfg.groups.slice();
  var fullSlots=old.filter(function(g){return !g.archived;}).map(function(g){return {gid:g.id,count:g.multi>0?g.multi:1};});
  old.forEach(function(g){delete g.multi;});
  DEFAULT_GROUPS.forEach(function(dg){if(!old.some(function(g){return g.id===dg.id;}))old.push(clone(dg));});
  cfg.groups=old;
  var progs=clone(DEFAULT_PROGRAMS);
  progs[0].slots=fullSlots;
  cfg.programs=progs;
  cfg.lastProgram="p_full";
  cfg.version=2;
  if(!cfg.settings)cfg.settings={repLo:10,repHi:12,sets:3};
  return cfg;
}

function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);}
function pad(n){return (n<10?"0":"")+n;}
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayIso(){return isoOf(new Date());}
function dateObj(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function shiftIso(iso,days){var d=dateObj(iso);d.setDate(d.getDate()+days);return isoOf(d);}
function fmtDate(iso,withWd){var d=dateObj(iso);var s=d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}).replace(".","");if(withWd){s=d.toLocaleDateString("ru-RU",{weekday:"short"})+", "+s;}return s;}
function fmtNum(n){if(n===null||n===undefined||n==="")return "";return String(Math.round(n*100)/100).replace(".",",");}
function parseNum(s){s=String(s).trim().replace(",",".");if(s==="")return null;var n=parseFloat(s);return isFinite(n)?n:null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var state = {
  config: defaultConfig(),
  workouts: {},
  date: todayIso(),
  draft: null,
  dirty: 0,
  tab: "workout",
  progEx: null,
  confirm: null,
  msg: null,
  pendingImport: null,
  mode: "local"
};
function applySettings(){
  var s=state.config.settings||{};
  REP_LO=s.repLo>0?s.repLo:10; REP_HI=s.repHi>=REP_LO?s.repHi:Math.max(REP_LO,12); SETS=s.sets>0?s.sets:3;
}

/* ---------- хранение ---------- */
var LS_KEY = "trenlog.v1";
var store = {
  col:null,
  loadLocal:function(){
    try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);if(d.config&&d.config.groups)state.config=migrate(d.config);state.workouts=d.workouts||{};}}catch(e){}
  },
  saveLocal:function(){try{localStorage.setItem(LS_KEY,JSON.stringify({config:state.config,workouts:state.workouts}));}catch(e){}},
  chains:{},
  write:function(key,fn){
    var prev=store.chains[key]||Promise.resolve();
    var next=prev.then(fn,fn);
    store.chains[key]=next.catch(function(){});
    return next;
  },
  saveConfig:function(){
    if(store.col){setStatus("saving");return store.write("config",function(){return store.col.doc("config").set({kind:"config",config:clone(state.config)});}).then(function(){setStatus("ok");},onWriteErr);}
    store.saveLocal();setStatus("ok");return Promise.resolve();
  },
  saveWorkout:function(w){
    var id="w_"+w.date;
    if(store.col){setStatus("saving");return store.write(id,function(){
      return w.entries.length?store.col.doc(id).set({kind:"workout",date:w.date,programId:w.programId||null,entries:w.entries}):store.col.doc(id).delete();
    }).then(function(){setStatus("ok");},onWriteErr);}
    store.saveLocal();setStatus("ok");return Promise.resolve();
  },
  replaceAll:function(){
    if(!store.col){store.saveLocal();return Promise.resolve();}
    var self=this;
    return store.col.get().then(function(snap){
      var keep={};Object.keys(state.workouts).forEach(function(d){keep["w_"+d]=true;});
      var jobs=snap.docs.filter(function(d){return d.id!=="config"&&!keep[d.id];}).map(function(d){return store.col.doc(d.id).delete();});
      return Promise.all(jobs);
    }).then(function(){
      var p=self.saveConfig();
      Object.keys(state.workouts).forEach(function(d){p=p.then(function(){return self.saveWorkout(state.workouts[d]);});});
      return p;
    });
  }
};
function onWriteErr(e){
  if(e&&e.code==="quota_exceeded")setStatus("err","Место закончилось");
  else setStatus("err","Не сохранилось, повторю при следующем изменении");
}
function setStatus(kind,text){
  var el=document.getElementById("status");
  el.className="status"+(kind==="ok"?" ok":"");
  if(kind==="saving")el.textContent="Сохраняю…";
  else if(kind==="ok")el.textContent="Сохранено ✓";
  else el.textContent=text||"";
}

/* ---------- данные ---------- */
function groups(){return state.config.groups;}
function liveGroups(){return groups().filter(function(g){return !g.archived;});}
function group(id){return groups().filter(function(g){return g.id===id;})[0]||null;}
function programs(){return state.config.programs.filter(function(p){return !p.archived;});}
function program(id){return state.config.programs.filter(function(p){return p.id===id;})[0]||null;}
function findEx(id){var gs=groups();for(var i=0;i<gs.length;i++){for(var j=0;j<gs[i].ex.length;j++){if(gs[i].ex[j].id===id)return {g:gs[i],e:gs[i].ex[j]};}}return null;}
function exName(id){var f=findEx(id);return f?f.e.name:"Упражнение удалено";}
function workSets(entry){return (entry.sets||[]).filter(function(s){return !s.wu&&s.r>0;});}
function sortedDates(){return Object.keys(state.workouts).sort();}
function lastSession(exId,before){
  var ds=sortedDates();
  for(var i=ds.length-1;i>=0;i--){
    if(ds[i]>=before)continue;
    var w=state.workouts[ds[i]];
    for(var j=0;j<w.entries.length;j++){var en=w.entries[j];if(en.exId===exId&&workSets(en).length)return {date:ds[i],entry:en};}
  }
  return null;
}
function stepFor(w){return w<10?1:2.5;}
function recommend(exId,date){
  var last=lastSession(exId,date);
  if(!last)return {type:"new"};
  var ws=workSets(last.entry);
  var top=Math.max.apply(null,ws.map(function(s){return s.w||0;}));
  var allTop=ws.every(function(s){return s.r>=REP_HI;});
  if(top<=0)return {type:allTop?"up":"hold",w:0,bw:true,last:last};
  if(allTop)return {type:"up",w:Math.round((top+stepFor(top))*100)/100,last:last};
  return {type:"hold",w:top,last:last};
}
function setsText(entry){
  var ws=workSets(entry);if(!ws.length)return "";
  var sameW=ws.every(function(s){return s.w===ws[0].w;});
  if(sameW)return (ws[0].w?fmtNum(ws[0].w)+" кг × ":"")+ws.map(function(s){return s.r;}).join(", ");
  return ws.map(function(s){return (s.w?fmtNum(s.w)+"×":"")+s.r;}).join(", ");
}
function newEntry(gid,exId){
  var rec=recommend(exId,state.date);
  var w=(rec.w!==undefined&&rec.w>0)?rec.w:null;
  var sets=[];for(var i=0;i<SETS;i++)sets.push({w:w,r:null});
  return {gid:gid,exId:exId,sets:sets};
}
function entryDone(en){return workSets(en).length>0;}
function groupDone(gid){return state.draft.entries.some(function(en){return en.gid===gid&&entryDone(en);});}
/* Слоты на экране: из выбранной тренировки + группы, где уже есть записи. */
function currentSlots(){
  var p=program(state.draft.programId);
  var slots=p?p.slots.filter(function(s){var g=group(s.gid);return g&&!g.archived;}).map(function(s){return {gid:s.gid,count:s.count};}):[];
  state.draft.entries.forEach(function(en){
    if(!slots.some(function(s){return s.gid===en.gid;})&&group(en.gid))slots.push({gid:en.gid,count:1,extra:true});
  });
  slots.forEach(function(s){var n=state.draft.entries.filter(function(en){return en.gid===s.gid;}).length;if(n>s.count)s.count=n;});
  return slots;
}
function programName(id){var p=program(id);return p?p.name:"";}

/* ---------- черновик и сохранение ---------- */
var saveTimer=null;
function loadDraft(){
  var w=state.workouts[state.date];
  state.draft=w?clone(w):{date:state.date,entries:[]};
  state.draft.entries.forEach(function(en){en.sets=(en.sets||[]).filter(function(s){return !s.wu;});});
  if(!state.draft.programId||!program(state.draft.programId)||program(state.draft.programId).archived){
    var lp=state.config.lastProgram;
    state.draft.programId=(lp&&program(lp)&&!program(lp).archived)?lp:(programs()[0]?programs()[0].id:null);
  }
  state.dirty=0;
}
function touch(){state.dirty++;clearTimeout(saveTimer);setStatus("saving");saveTimer=setTimeout(flush,700);}
function flush(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!state.dirty)return;
  var mark=state.dirty;
  var w=clone(state.draft);
  if(w.entries.length)state.workouts[w.date]=w;else delete state.workouts[w.date];
  store.saveWorkout(w).then(function(){if(state.dirty===mark)state.dirty=0;});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flush();});
window.addEventListener("pagehide",flush);

/* ---------- экран ---------- */
var view=document.getElementById("view");
function render(){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.tab===state.tab);});
  document.getElementById("daterow").hidden=state.tab!=="workout";
  renderDate();
  if(state.tab==="workout")renderWorkout();
  else if(state.tab==="history")renderHistory();

  else renderSettings();
}
function rerender(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}
function renderDate(){
  document.getElementById("dateLabel").textContent=fmtDate(state.date,true);
  document.getElementById("todayTag").hidden=state.date!==todayIso();
  document.getElementById("dateInput").value=state.date;
}
function plate(i){return '<span class="plate" style="--pc:var('+PLATES[i%PLATES.length]+')"></span>';}

function recHtml(exId){
  var r=recommend(exId,state.date);
  if(r.type==="new")return '<div class="rec new"><div class="goal">Первый раз — подбери вес на '+REP_LO+'–'+REP_HI+' повторов</div></div>';
  var last='<div class="last">Прошлый раз, '+fmtDate(r.last.date)+': <span>'+esc(setsText(r.last.entry))+'</span></div>';
  var goal;
  if(r.bw)goal=r.type==="up"?"Сегодня: добавь 2–3 повтора или вес":"Сегодня: постарайся сделать на повтор больше";
  else if(r.type==="up")goal='Сегодня: <span>'+fmtNum(r.w)+' кг</span> × '+REP_LO+'–'+REP_HI+' ↑ прибавка';
  else goal='Сегодня: <span>'+fmtNum(r.w)+' кг</span>, добей до '+REP_HI+' во всех подходах';
  return '<div class="rec '+r.type+'">'+last+'<div class="goal">'+goal+'</div></div>';
}
function loggerHtml(gid,en,showName){
  var rows=en.sets.map(function(s,i){
    var a='data-g="'+gid+'" data-e="'+en.exId+'" data-i="'+i+'"';
    return '<div class="set"><span class="n">'+(i+1)+'</span>'+
      '<div class="fld"><input id="w-'+en.exId+'-'+i+'" inputmode="decimal" autocomplete="off" '+a+' data-f="w" value="'+fmtNum(s.w)+'" placeholder="0" aria-label="Вес"><small>кг</small></div>'+
      '<span class="x">×</span>'+
      '<div class="fld"><input id="r-'+en.exId+'-'+i+'" inputmode="numeric" autocomplete="off" '+a+' data-f="r" value="'+(s.r||"")+'" placeholder="'+REP_LO+'–'+REP_HI+'" aria-label="Повторы"><small>раз</small></div>'+
      '<button class="del" data-act="delset" '+a+' aria-label="Убрать подход">×</button></div>';
  }).join("");
  return '<div class="log">'+(showName?'<h3>'+esc(exName(en.exId))+'</h3>':'')+recHtml(en.exId)+
    '<div class="sets">'+rows+'</div><button class="addset" data-act="addset" data-g="'+gid+'" data-e="'+en.exId+'">+ подход</button></div>';
}
function renderWorkout(){
  var progs=programs();
  if(!progs.length){view.innerHTML='<div class="empty">Нет ни одной тренировки.<br>Создай её во вкладке «Настройки» → «Мои тренировки».</div>';return;}
  var h='<div class="progpick"><span class="lbl">Тренировка</span><div class="chips">'+progs.map(function(p){
    var on=p.id===state.draft.programId;
    return '<button class="chip big'+(on?' on':'')+'" data-act="prog" data-p="'+p.id+'" aria-pressed="'+on+'">'+esc(p.name)+'</button>';
  }).join("")+'</div></div>';
  var slots=currentSlots();
  var done=slots.filter(function(s){return groupDone(s.gid);}).length;
  h+='<div class="summary"><div class="meter" id="meter" style="--n:'+Math.max(slots.length,1)+'">'+slots.map(function(s){return '<i class="'+(groupDone(s.gid)?'on':'')+'"></i>';}).join("")+'</div><b id="doneCount">'+done+' / '+slots.length+'</b></div>';
  if(!slots.length)h+='<div class="empty">В этой тренировке пока нет групп мышц.<br>Добавь их в «Настройки» → «Мои тренировки».</div>';
  slots.forEach(function(s,si){
    var g=group(s.gid);
    var entries=state.draft.entries.filter(function(en){return en.gid===s.gid;});
    var chips=g.ex.filter(function(e){return !e.archived;}).map(function(e){
      var on=entries.some(function(en){return en.exId===e.id;});
      return '<button class="chip'+(on?' on':'')+'" data-act="pick" data-g="'+g.id+'" data-e="'+e.id+'" data-c="'+s.count+'" aria-pressed="'+on+'">'+esc(e.name)+'</button>';
    }).join("");
    var tag=groupDone(s.gid)?'<span class="check">✓</span>':(s.count>1?'<span class="tag">до '+s.count+' упр.</span>':(s.extra?'<span class="tag">вне плана</span>':''));
    h+='<section class="group'+(groupDone(s.gid)?' done':'')+'" data-group="'+g.id+'"><div class="ghead">'+plate(si)+'<h2>'+esc(g.name)+'</h2>'+tag+'</div>'+
      '<div class="chips">'+(chips||'<span class="hint">Нет упражнений — добавь в «Настройках»</span>')+'</div>'+
      entries.map(function(en){return loggerHtml(g.id,en,s.count>1);}).join("")+'</section>';
  });
  h+='<p class="hint">Вес подставляется по прошлой тренировке — впиши только повторы.</p>';
  view.innerHTML=h;
}
function updateSummary(){
  var slots=currentSlots();var done=0;var bars=document.querySelectorAll("#meter i");
  slots.forEach(function(s,i){var d=groupDone(s.gid);if(d)done++;if(bars[i])bars[i].classList.toggle("on",d);
    var sec=view.querySelector('[data-group="'+s.gid+'"]');if(sec)sec.classList.toggle("done",d);});
  var dc=document.getElementById("doneCount");if(dc)dc.textContent=done+" / "+slots.length;
}

function renderHistory(){
  var ds=sortedDates().reverse();
  if(!ds.length){view.innerHTML='<div class="empty">Здесь появятся твои тренировки.<br>Открой вкладку «Тренировка», выбери упражнения и впиши повторы — всё сохранится само.</div>';return;}
  var h='<div class="sec-title">Тренировок: '+ds.length+'</div>';
  ds.forEach(function(d){
    var w=state.workouts[d];var de=w.entries.filter(entryDone);
    var lines=de.map(function(en){return '<div><span>'+esc(exName(en.exId))+'</span><span>'+esc(setsText(en))+'</span></div>';}).join("");
    var ask=state.confirm&&state.confirm.kind==="w"&&state.confirm.id===d;
    var btns=ask
      ?'<button class="btn solid-danger" data-act="delw" data-d="'+d+'">Удалить</button><button class="btn" data-act="cancel">Отмена</button>'
      :'<button class="btn primary" data-act="openw" data-d="'+d+'">Открыть</button><button class="btn danger" data-act="ask" data-k="w" data-id="'+d+'">Удалить</button>';
    var pn=programName(w.programId);
    h+='<div class="card"><div class="hrow"><h3>'+fmtDate(d,true)+'<em>'+(pn?esc(pn)+' · ':'')+de.length+' упр.</em></h3></div>'+
      '<div class="lines">'+(lines||'<div><span>Повторы ещё не вписаны</span><span></span></div>')+'</div><div class="btns">'+btns+'</div></div>';
  });
  view.innerHTML=h;
}

function exHistory(exId){
  var out=[];
  sortedDates().forEach(function(d){
    state.workouts[d].entries.forEach(function(en){
      if(en.exId!==exId)return;var ws=workSets(en);if(!ws.length)return;
      var top=Math.max.apply(null,ws.map(function(s){return s.w||0;}));
      var reps=Math.max.apply(null,ws.filter(function(s){return (s.w||0)===top;}).map(function(s){return s.r;}));
      out.push({date:d,entry:en,top:top,reps:reps});
    });
  });
  return out;
}
function chartSvg(pts,useReps){
  var W=340,H=170,L=34,R=12,T=14,B=26;
  var vals=pts.map(function(p){return useReps?p.reps:p.top;});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn=Math.max(0,mn-2);mx=mx+2;}
  var span=mx-mn;mn=Math.max(0,mn-span*0.1);mx=mx+span*0.1;
  function x(i){return pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);}
  function y(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График прогресса">';
  for(var k=0;k<3;k++){var v=mn+(mx-mn)*k/2;var yy=y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+fmtNum(Math.round(v*10)/10)+'</text>';}
  var path=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(vals[i]).toFixed(1);}).join(" ");
  if(pts.length>1){
    s+='<path d="'+path+" L"+x(pts.length-1).toFixed(1)+" "+(H-B)+" L"+x(0).toFixed(1)+" "+(H-B)+' Z" fill="var(--accent-soft)" stroke="none"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){var last=i===pts.length-1;
    s+='<circle cx="'+x(i)+'" cy="'+y(vals[i])+'" r="'+(last?5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';});
  s+='<text x="'+x(0)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?'middle':'start')+'" font-size="10" fill="var(--muted)">'+fmtDate(pts[0].date)+'</text>';
  if(pts.length>1)s+='<text x="'+x(pts.length-1)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtDate(pts[pts.length-1].date)+'</text>';
  return s+'</svg>';
}
function renderProgress(){
  var gs=groups();var withHist={};
  gs.forEach(function(g){g.ex.forEach(function(e){if(exHistory(e.id).length)withHist[e.id]=true;});});
  if(!state.progEx||!withHist[state.progEx])state.progEx=Object.keys(withHist)[0]||null;
  if(!state.progEx){view.innerHTML='<div class="empty">Графики появятся после первой записанной тренировки.<br>Для каждого упражнения будет видно, как растёт рабочий вес.</div>';return;}
  var opts=gs.map(function(g){
    var o=g.ex.filter(function(e){return withHist[e.id];}).map(function(e){return '<option value="'+e.id+'"'+(e.id===state.progEx?' selected':'')+'>'+esc(e.name)+'</option>';}).join("");
    return o?'<optgroup label="'+esc(g.name)+'">'+o+'</optgroup>':'';
  }).join("");
  var hist=exHistory(state.progEx);
  var useReps=hist.every(function(p){return p.top<=0;});
  var best=hist.reduce(function(b,p){var v=useReps?p.reps:p.top,bv=useReps?b.reps:b.top;return v>bv||(v===bv&&p.reps>b.reps)?p:b;},hist[0]);
  var first=hist[0],last=hist[hist.length-1];
  var diff=useReps?last.reps-first.reps:Math.round((last.top-first.top)*100)/100;
  var unit=useReps?" раз":" кг";
  view.innerHTML='<select class="sel" id="progSel" aria-label="Упражнение">'+opts+'</select>'+
    '<div class="stats"><div class="stat"><small>Тренировок</small><b>'+hist.length+'</b></div>'+
    '<div class="stat"><small>Рекорд</small><b>'+(useReps?best.reps+unit:fmtNum(best.top)+'×'+best.reps)+'</b></div>'+
    '<div class="stat"><small>Прирост</small><b>'+(diff>0?'+':'')+fmtNum(diff)+unit+'</b></div></div>'+
    '<div class="chart">'+chartSvg(hist,useReps)+'</div>'+
    '<div class="sec-title">'+(useReps?'Лучший подход по повторам':'Рабочий вес по тренировкам')+'</div><div class="card"><div class="lines">'+
    hist.slice().reverse().map(function(p){return '<div><span>'+fmtDate(p.date,true)+'</span><span>'+esc(setsText(p.entry))+'</span></div>';}).join("")+'</div></div>';
}

/* ---------- настройки ---------- */
function confirmBtns(kind,id,label){
  var ask=state.confirm&&state.confirm.kind===kind&&state.confirm.id===id;
  return ask?'<span class="btns"><button class="btn solid-danger" data-act="del-'+kind+'" data-id="'+id+'">Удалить</button><button class="btn" data-act="cancel">Нет</button></span>'
            :'<button class="rm" data-act="ask" data-k="'+kind+'" data-id="'+id+'">'+(label||"Удалить")+'</button>';
}
function renderSettings(){
  var h='<div class="sec-title">Мои тренировки</div>'+

  programs().forEach(function(p){

        '<span class="mv"><button data-act="mv" data-p="'+p.id+'" data-i="'+i+'" data-d="-1" aria-label="Выше"'+(i===0?' disabled':'')+'>↑</button><button data-act="mv" data-p="'+p.id+'" data-i="'+i+'" data-d="1" aria-label="Ниже"'+(i===p.slots.length-1?' disabled':'')+'>↓</button></span>'+
        '<button class="x2" data-act="rmslot" data-p="'+p.id+'" data-i="'+i+'" aria-label="Убрать группу из тренировки">×</button></div>';

    var free=liveGroups().filter(function(g){return !usedIds[g.id];});
    h+='<div class="card prog"><div class="hrow"><input class="nameinp" id="pn-'+p.id+'" data-ren="p" data-id="'+p.id+'" value="'+esc(p.name)+'" aria-label="Название тренировки">'+
      (programs().length>1?confirmBtns("p",p.id):'')+'</div>'+
      '<div class="slothead"><span>Группа мышц</span><span>Упражнений</span></div>'+
      '<div class="slots">'+(slots||'<p>Добавь группы мышц ниже</p>')+'</div>'+
      (free.length?'<select class="sel small" id="add-slot-'+p.id+'" data-addslot="'+p.id+'" aria-label="Добавить группу"><option value="">+ Добавить группу мышц…</option>'+free.map(function(g){return '<option value="'+g.id+'">'+esc(g.name)+'</option>';}).join("")+'</select>':'')+
      '</div>';
  });
  h+='<form class="addrow" data-form="prog"><input id="newProg" placeholder="Название новой тренировки" aria-label="Название новой тренировки"><button class="btn primary" type="submit">Создать</button></form>';

  h+='<div class="sec-title">Группы мышц и упражнения</div><p class="hint left">Удалённое упражнение пропадёт из выбора, но история по нему сохранится.</p>';
  liveGroups().forEach(function(g,gi){
    var rows=g.ex.filter(function(e){return !e.archived;}).map(function(e){
      return '<div class="exrow"><span>'+esc(e.name)+'</span>'+confirmBtns("e",e.id)+'</div>';
    }).join("");
    h+='<details class="card gcard"'+(state.openGroup===g.id?' open':'')+' data-gd="'+g.id+'"><summary>'+plate(gi)+'<span class="gsum">'+esc(g.name)+'</span><em>'+g.ex.filter(function(e){return !e.archived;}).length+'</em></summary>'+
      '<div class="gbody"><div class="hrow"><input class="nameinp" id="gn-'+g.id+'" data-ren="g" data-id="'+g.id+'" value="'+esc(g.name)+'" aria-label="Название группы">'+confirmBtns("g",g.id,"Удалить группу")+'</div>'+
      '<div>'+(rows||'<div class="hint">Пока пусто</div>')+'</div>'+
      '<form class="addrow" data-form="ex" data-g="'+g.id+'"><input id="add-'+g.id+'" placeholder="Новое упражнение" aria-label="Новое упражнение"><button class="btn primary" type="submit">Добавить</button></form></div></details>';
  });
  h+='<form class="addrow" data-form="group"><input id="newGroup" placeholder="Новая группа мышц" aria-label="Новая группа мышц"><button class="btn primary" type="submit">Создать</button></form>';

  h+='<div class="sec-title">Подходы и повторы</div><div class="card">'+
    '<div class="setgrid">'+
    '<label>Повторов от<input id="setRepLo" type="number" inputmode="numeric" min="1" max="50" value="'+REP_LO+'"></label>'+
    '<label>Повторов до<input id="setRepHi" type="number" inputmode="numeric" min="1" max="50" value="'+REP_HI+'"></label>'+
    '<label>Подходов<input id="setSets" type="number" inputmode="numeric" min="1" max="10" value="'+SETS+'"></label>'+
    '</div><p>Когда сделаешь верхнюю границу во всех подходах, приложение предложит прибавить вес.</p></div>';

  h+='<div class="sec-title">Резервная копия</div><div class="card">'+
    '<p>'+(IS_ARTIFACT?'Скопируй данные, чтобы перенести их в отдельное приложение или на другой телефон.':'Все записи хранятся только на этом телефоне. Время от времени сохраняй копию — с ней данные можно перенести на новый телефон.')+'</p>'+
    '<div class="btns">'+((IS_ARTIFACT||window.Capacitor)?'':'<button class="btn primary" data-act="export">Сохранить файлом</button><label class="btn" for="importFile">Загрузить из файла</label><input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>')+
    '<button class="btn'+((IS_ARTIFACT||window.Capacitor)?' primary':'')+'" data-act="copyData">Скопировать текстом</button></div>'+
    '<details><summary class="sumlink">Вставить данные текстом</summary>'+
    '<div class="col"><textarea id="importText" placeholder="Вставь сюда скопированные данные"></textarea>'+
    '<button class="btn" data-act="importText">Загрузить</button></div></details>'+
    (state.pendingImport?'<div class="card warn"><p><b>Заменить данные?</b> В копии тренировок: '+Object.keys(state.pendingImport.workouts).length+'. Текущие записи будут заменены.</p><div class="btns"><button class="btn solid-danger" data-act="importYes">Заменить</button><button class="btn" data-act="importNo">Отмена</button></div></div>':'')+
    '<span class="msg '+(state.msg&&state.msg.ok?'ok':'err')+'" id="backupMsg">'+(state.msg?esc(state.msg.text):'')+'</span></div>';
  view.innerHTML=h;
}

/* ---------- резервная копия ---------- */
function backupData(){return {app:"dnevnik-zala",version:2,exported:new Date().toISOString(),config:state.config,workouts:state.workouts};}
function prepareImport(text){
  var d=null;try{d=JSON.parse(String(text).trim());}catch(e){}
  if(!d||!d.config||!d.config.groups||typeof d.workouts!=="object"){state.msg={ok:false,text:"Не получилось прочитать копию. Проверь, что это данные из «Дневника зала»."};state.pendingImport=null;}
  else{state.pendingImport={config:migrate(d.config),workouts:d.workouts||{}};state.msg=null;}
  rerender(renderSettings);
}
function copyData(){
  flush();
  var text=JSON.stringify(backupData());
  var done=function(){state.msg={ok:true,text:"Скопировано ✓ Сохрани текст в заметках или отправь себе в мессенджер"};rerender(renderSettings);};
  var fallback=function(){
    var ta=document.getElementById("importText");var det=ta&&ta.closest("details");
    if(det)det.open=true;if(ta){ta.value=text;ta.focus();ta.select();}
    var m=document.getElementById("backupMsg");if(m){m.className="msg ok";m.textContent="Текст выделен — скопируй его";}
  };
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}
function doExport(){
  flush();
  var name="dnevnik-zala-"+todayIso()+".json";
  var blob=new Blob([JSON.stringify(backupData())],{type:"application/json"});
  try{
    var file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Дневник зала — копия"}).then(function(){state.msg={ok:true,text:"Копия сохранена"};rerender(renderSettings);},function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  state.msg={ok:true,text:"Файл "+name+" сохранён в загрузки"};rerender(renderSettings);
}

/* ---------- события ---------- */
document.querySelector(".tabs").addEventListener("click",function(e){
  var t=e.target.closest(".tab");if(!t)return;
  flush();state.tab=t.dataset.tab;state.confirm=null;state.msg=null;render();window.scrollTo(0,0);
});
function goDate(iso){if(!iso)return;flush();state.date=iso;loadDraft();render();window.scrollTo(0,0);}
document.getElementById("dateInput").addEventListener("change",function(e){goDate(e.target.value);});
document.getElementById("prevDay").addEventListener("click",function(){goDate(shiftIso(state.date,-1));});
document.getElementById("nextDay").addEventListener("click",function(){goDate(shiftIso(state.date,1));});

function saveCfg(){store.saveConfig();rerender(renderSettings);}
view.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var act=b.dataset.act,gid=b.dataset.g,exId=b.dataset.e,id=b.dataset.id;
  var ents=state.draft.entries;
  if(act==="prog"){
    state.draft.programId=b.dataset.p;state.config.lastProgram=b.dataset.p;
    if(ents.length)touch();
    store.saveConfig();rerender(renderWorkout);
  }
  else if(act==="pick"){
    var count=+b.dataset.c||1;
    var idx=-1;ents.forEach(function(en,i){if(en.gid===gid&&en.exId===exId)idx=i;});
    if(idx>=0)ents.splice(idx,1);
    else if(count>1){
      if(ents.filter(function(en){return en.gid===gid;}).length>=count)return;
      ents.push(newEntry(gid,exId));
    }else{
      state.draft.entries=ents.filter(function(en){return en.gid!==gid;});
      state.draft.entries.push(newEntry(gid,exId));
    }
    touch();rerender(renderWorkout);
  }
  else if(act==="addset"||act==="delset"){
    var en=ents.filter(function(x){return x.gid===gid&&x.exId===exId;})[0];if(!en)return;
    if(act==="addset"){var lw=en.sets.length?en.sets[en.sets.length-1].w:null;en.sets.push({w:lw,r:null});}
    else en.sets.splice(+b.dataset.i,1);
    touch();rerender(renderWorkout);
  }
  else if(act==="openw"){state.date=b.dataset.d;loadDraft();state.tab="workout";render();window.scrollTo(0,0);}
  else if(act==="ask"){state.confirm={kind:b.dataset.k,id:id};rerender(state.tab==="history"?renderHistory:renderSettings);}
  else if(act==="cancel"){state.confirm=null;rerender(state.tab==="history"?renderHistory:renderSettings);}
  else if(act==="delw"){
    var d=b.dataset.d;delete state.workouts[d];state.confirm=null;
    if(d===state.date){clearTimeout(saveTimer);saveTimer=null;state.draft.entries=[];state.dirty=0;}
    store.saveWorkout({date:d,entries:[]});rerender(renderHistory);
  }
  else if(act==="del-e"){var f=findEx(id);if(f)f.e.archived=true;state.confirm=null;
    state.draft.entries=state.draft.entries.filter(function(x){return !(x.exId===id&&!entryDone(x));});saveCfg();}
  else if(act==="del-g"){var g=group(id);if(g)g.archived=true;state.confirm=null;
    state.config.programs.forEach(function(p){p.slots=p.slots.filter(function(s){return s.gid!==id;});});saveCfg();}
  else if(act==="del-p"){var p=program(id);if(p&&programs().length>1)p.archived=true;state.confirm=null;
    if(state.config.lastProgram===id)state.config.lastProgram=programs()[0].id;
    if(state.draft.programId===id)state.draft.programId=state.config.lastProgram;saveCfg();}
  else if(act==="cnt"){var p2=program(b.dataset.p);var s=p2.slots[+b.dataset.i];s.count=Math.max(1,Math.min(5,s.count+(+b.dataset.d)));saveCfg();}
  else if(act==="mv"){var p3=program(b.dataset.p);var i=+b.dataset.i,j=i+(+b.dataset.d);if(j<0||j>=p3.slots.length)return;var t=p3.slots[i];p3.slots[i]=p3.slots[j];p3.slots[j]=t;saveCfg();}
  else if(act==="rmslot"){var p4=program(b.dataset.p);p4.slots.splice(+b.dataset.i,1);saveCfg();}
  else if(act==="export")doExport();
  else if(act==="copyData")copyData();
  else if(act==="importText"){var ta=document.getElementById("importText");if(ta&&ta.value.trim())prepareImport(ta.value);}
  else if(act==="importNo"){state.pendingImport=null;rerender(renderSettings);}
  else if(act==="importYes"&&state.pendingImport){
    clearTimeout(saveTimer);saveTimer=null;
    state.config=clone(state.pendingImport.config);state.workouts=clone(state.pendingImport.workouts);
    state.pendingImport=null;applySettings();loadDraft();
    store.replaceAll();
    state.msg={ok:true,text:"Данные загружены: тренировок "+Object.keys(state.workouts).length};rerender(renderSettings);
  }
});
view.addEventListener("toggle",function(e){
  var d=e.target;if(d.dataset&&d.dataset.gd){if(d.open)state.openGroup=d.dataset.gd;else if(state.openGroup===d.dataset.gd)state.openGroup=null;}
},true);
view.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  var en=state.draft.entries.filter(function(x){return x.gid===t.dataset.g&&x.exId===t.dataset.e;})[0];if(!en)return;
  var s=en.sets[+t.dataset.i];if(!s)return;
  var v=parseNum(t.value);
  if(t.dataset.f==="r")s.r=v===null?null:Math.round(v);else s.w=v;
  touch();updateSummary();
});
view.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="progSel"){state.progEx=t.value;renderProgress();}
  else if(t.dataset.ren){
    var name=t.value.trim();var obj=t.dataset.ren==="p"?program(t.dataset.id):group(t.dataset.id);
    if(!obj)return;if(!name){t.value=obj.name;return;}obj.name=name;store.saveConfig();
  }
  else if(t.dataset.addslot){
    if(!t.value)return;program(t.dataset.addslot).slots.push({gid:t.value,count:1});saveCfg();
  }
  else if(t.id==="setRepLo"||t.id==="setRepHi"||t.id==="setSets"){
    var lo=parseInt(document.getElementById("setRepLo").value,10),hi=parseInt(document.getElementById("setRepHi").value,10),st=parseInt(document.getElementById("setSets").value,10);
    if(!(lo>0))lo=10;if(!(hi>=lo))hi=lo;if(!(st>0))st=3;if(st>10)st=10;
    state.config.settings={repLo:lo,repHi:hi,sets:st};applySettings();saveCfg();
  }
  else if(t.id==="importFile"&&t.files&&t.files[0]){
    var rd=new FileReader();rd.onload=function(){prepareImport(rd.result);};rd.readAsText(t.files[0]);
  }
});
view.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.ren){e.preventDefault();e.target.blur();}});
view.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;var inp=f.querySelector("input");var name=inp.value.trim();if(!name)return;
  if(f.dataset.form==="ex"){group(f.dataset.g).ex.push({id:uid("x"),name:name});state.openGroup=f.dataset.g;saveCfg();var a=document.getElementById("add-"+f.dataset.g);if(a)a.focus();}
  else if(f.dataset.form==="group"){var ng={id:uid("g"),name:name,ex:[]};state.config.groups.push(ng);state.openGroup=ng.id;saveCfg();var a2=document.getElementById("add-"+ng.id);if(a2)a2.focus();}
  else if(f.dataset.form==="prog"){var np={id:uid("p"),name:name,slots:[]};state.config.programs.push(np);saveCfg();var s2=document.getElementById("add-slot-"+np.id);if(s2)s2.focus();}
});

/* ---------- запуск ---------- */
store.loadLocal();
applySettings();
loadDraft();
render();
setStatus("ok");

function applySnapshot(snap){
  var ws={},cfg=null;
  snap.docs.forEach(function(d){var v=d.data();if(!v)return;
    if(d.id==="config"&&v.config&&v.config.groups)cfg=v.config;
    else if(v.kind==="workout"&&v.date)ws[v.date]=clone({date:v.date,programId:v.programId||null,entries:v.entries||[]});});
  var needSave=false;
  if(cfg){var m=migrate(cfg);needSave=!(cfg.version>=2&&cfg.programs);state.config=m;}
  if(state.dirty&&state.draft&&state.draft.entries.length)ws[state.date]=clone(state.draft);
  state.workouts=ws;applySettings();
  var ae=document.activeElement;
  var typing=ae&&view.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT");
  if(!state.dirty&&!saveTimer)loadDraft();
  if(!typing)rerender(render);
  if(needSave)store.saveConfig();
}
if(IS_ARTIFACT&&window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      store.col=db.collection("data/users/"+id);state.mode="db";setStatus("ok");
      store.col.onSnapshot(applySnapshot,function(){store.col=null;state.mode="local";setStatus("err","Нет связи — сохраняю на устройстве");});
    });
  }).catch(function(){});
}
if(!IS_ARTIFACT){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.Capacitor){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
  }
}
})();
</script>
