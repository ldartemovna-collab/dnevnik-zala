<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник зала</title>
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник зала">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone column — sticky date bar on top, group "plates" as cards, tab bar fixed at bottom */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#141c26; --muted:#5b6876; --line:#d5dce4;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --accent-ink:#ffffff;
  --good:#17804b; --good-soft:#dff3e8; --warm:#a86508; --warm-soft:#fbefd9; --danger:#c0322f;
  --p-red:#d43c3c; --p-blue:#2457d6; --p-yellow:#dcae17; --p-green:#2c9a55; --p-grey:#7d8794;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --surface:#172028; --surface-2:#1d2731; --ink:#e6ecf2; --muted:#93a0ad; --line:#2a3541;
  --accent:#7193ff; --accent-soft:#1f2c4d; --accent-ink:#0a1020;
  --good:#4fc68a; --good-soft:#163527; --warm:#e6aa4f; --warm-soft:#3a2b14; --danger:#ff6b66;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --surface:#172028; --surface-2:#1d2731; --ink:#e6ecf2; --muted:#93a0ad; --line:#2a3541;
  --accent:#7193ff; --accent-soft:#1f2c4d; --accent-ink:#0a1020;
  --good:#4fc68a; --good-soft:#163527; --warm:#e6aa4f; --warm-soft:#3a2b14; --danger:#ff6b66;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.01em;margin:0}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good)}
.daterow{display:flex;align-items:center;gap:8px}
.daterow .nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.datebox{flex:1;min-width:0;position:relative;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.datebox .today{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px 8px;display:flex;flex-direction:column;gap:12px}

/* summary strip */
.summary{display:flex;align-items:center;gap:12px}
.meter{flex:1;display:grid;gap:4px;grid-template-columns:repeat(var(--n),1fr)}
.meter i{height:8px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--good)}
.summary b{font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap}

/* group card */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.group.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ghead{display:flex;align-items:center;gap:10px}
.plate{width:22px;height:22px;border-radius:50%;flex:none;background:var(--pc);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--pc) 70%,#000 0%),inset 0 0 0 7px var(--surface);position:relative}
.plate::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ghead h2{font-size:15px;font-weight:700;margin:0;flex:1;min-width:0}
.ghead .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ghead .check{color:var(--good);font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;line-height:1.2}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* logger */
.log{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.log h3{margin:0;font-size:14px;font-weight:700}
.rec{border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.rec .last{color:var(--muted)}
.rec .last span,.rec .goal span{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.rec .goal{font-weight:600}
.rec.up{background:var(--good-soft)} .rec.up .goal{color:var(--good)}
.rec.hold{background:var(--warm-soft)} .rec.hold .goal{color:var(--warm)}
.rec.new .goal{color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr auto 1fr 34px;align-items:center;gap:6px}
.set .n{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.set .n.wu{color:var(--warm)}
.set .x{color:var(--muted);font-size:13px}
.fld{position:relative;min-width:0}
.fld input{width:100%;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center;padding:0 30px 0 8px;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.fld input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.fld small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set .del{width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:8px}
.set.wurow .fld input{border-style:dashed}
.addset{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:9px;padding:7px 12px;font-size:13px;color:var(--accent);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 8px}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sec-title{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.02em;margin:4px 2px 0;color:var(--muted);text-transform:uppercase}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow h3{margin:0;font-size:15px;font-weight:700}
.hrow h3 em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines span:last-child{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.lines span:first-child{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* exercises editor */
.exrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow:last-of-type{border-bottom:0}
.exrow span{min-width:0}
.exrow .rm{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}

/* progress */
.sel{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--f-num);font-size:17px;font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:none;border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.chip,.tab,.meter i{transition:background-color .15s,color .15s,border-color .15s}}
.setgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.setgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.setgrid input{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center;width:100%}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card textarea{width:100%;min-height:90px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-num);font-size:12px;padding:8px;resize:vertical}
.msg{font-size:13px;font-weight:600}
.msg.ok{color:var(--good)} .msg.err{color:var(--danger)}
.progpick{display:flex;flex-direction:column;gap:6px}
.progpick .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chip.big{padding:9px 16px;font-size:14.5px;font-weight:600}
.hint.left{text-align:left;padding:0 2px;margin:0}
.nameinp{flex:1;min-width:0;height:40px;border-radius:9px;border:1px solid transparent;background:var(--surface-2);padding:0 10px;font-size:15px;font-weight:700}
.nameinp:focus{border-color:var(--accent);background:var(--surface);outline:none}
.slothead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
.slots{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .sname{flex:1;min-width:0;font-size:14px;font-weight:500}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--surface-2);font-size:16px;font-weight:600}
.stepper b{min-width:26px;text-align:center;font-family:var(--f-num);font-size:14px}
.mv{display:inline-flex;gap:2px}
.mv button,.slot .x2{width:30px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:15px}
.stepper button:disabled,.mv button:disabled{opacity:.3;cursor:default}
.sel.small{height:38px;font-weight:500;color:var(--accent)}
.gcard{padding:0;gap:0}
.gcard summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;font-weight:700}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary .gsum{flex:1;min-width:0}
.gcard summary em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:600}
.gcard summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.gcard[open] summary::after{transform:rotate(90deg)}
.gbody{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.sumlink{font-size:13px;color:var(--muted);cursor:pointer}
.col{display:flex;flex-direction:column;gap:6px;margin-top:8px;align-items:flex-start}
.card.warn{border-color:var(--danger)}
.card.warn b{color:var(--ink)}

/* ===== v3 ===== */
:root{--mm-empty:#dfe4ea;--gold:#b7791f;--gold-soft:#fdf1d8;--shadow:0 10px 30px rgba(15,23,42,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mm-empty:#26313c;--gold:#f2c14e;--gold-soft:#3a2e12;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--mm-empty:#26313c;--gold:#f2c14e;--gold-soft:#3a2e12;--shadow:0 10px 30px rgba(0,0,0,.5)}
/* цвета акцента */
:root[data-accent="pink"]{--accent:#c2255c;--accent-soft:#fce4ee;--accent-ink:#fff}
:root[data-accent="violet"]{--accent:#6d28d9;--accent-soft:#ede5fb;--accent-ink:#fff}
:root[data-accent="green"]{--accent:#15803d;--accent-soft:#dcf3e4;--accent-ink:#fff}
:root[data-accent="orange"]{--accent:#c2410c;--accent-soft:#fde8dc;--accent-ink:#fff}
@media (prefers-color-scheme: dark){
  :root[data-accent="pink"]:not([data-theme="light"]){--accent:#f783ac;--accent-soft:#4a1f31;--accent-ink:#1f0a12}
  :root[data-accent="violet"]:not([data-theme="light"]){--accent:#a98bff;--accent-soft:#2d2350;--accent-ink:#120a20}
  :root[data-accent="green"]:not([data-theme="light"]){--accent:#4ade80;--accent-soft:#173826;--accent-ink:#06140b}
  :root[data-accent="orange"]:not([data-theme="light"]){--accent:#fb923c;--accent-soft:#41260f;--accent-ink:#1a0c02}
}
:root[data-theme="dark"][data-accent="pink"]{--accent:#f783ac;--accent-soft:#4a1f31;--accent-ink:#1f0a12}
:root[data-theme="dark"][data-accent="violet"]{--accent:#a98bff;--accent-soft:#2d2350;--accent-ink:#120a20}
:root[data-theme="dark"][data-accent="green"]{--accent:#4ade80;--accent-soft:#173826;--accent-ink:#06140b}
:root[data-theme="dark"][data-accent="orange"]{--accent:#fb923c;--accent-soft:#41260f;--accent-ink:#1a0c02}

body.noscroll{overflow:hidden}
body.has-rest main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.btn.wide{width:100%;padding:11px 14px;font-size:14px}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 4px;cursor:pointer}
.linkbtn.plain{color:var(--ink);font-weight:500;padding:0;text-align:left}
.nav.sm{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px}

/* строка подхода */
.set{grid-template-columns:20px minmax(0,1.35fr) 10px minmax(0,1fr) 28px;gap:5px}
.set .del{width:28px}
.wfld{display:flex;align-items:center;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);overflow:hidden}
.wfld:focus-within{border-color:var(--accent);background:var(--surface)}
.wfld .fld{flex:1}
.wfld .fld input{border:0;background:transparent;padding:0 2px;height:40px}
.wfld .fld input:focus{background:transparent}
.pm{flex:none;width:30px;height:40px;border:0;background:none;color:var(--accent);font-size:18px;font-weight:700;touch-action:manipulation}
.pm:active{background:var(--accent-soft)}
.set > .fld input{padding:0 6px}
.set.logged .n{color:var(--accent-ink);background:var(--accent);border-radius:6px;height:22px;display:grid;place-items:center}
.lhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lhead h3{flex:1;min-width:0}
.lhead .sp{flex:1}
.kchip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 6px;border:0;background:var(--surface-2);color:var(--muted)}
.kchip.k-heavy{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.kchip.k-mid{background:var(--accent-soft);color:var(--accent)}
.kchip.k-iso{background:var(--good-soft);color:var(--good)}
.kchip.k-core{background:var(--warm-soft);color:var(--warm)}
button.kchip{cursor:pointer;min-width:52px}
.risk{font-size:12px}
.ltools{display:inline-flex;gap:4px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.tool.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{align-self:flex-start;border:0;background:none;padding:0;font-size:13px;color:var(--ink);text-align:left}
.note.empty{color:var(--muted)}
.noteedit{display:flex;gap:6px}
.noteedit input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--accent);background:var(--surface);padding:0 10px}
.log.inss{border-top-style:solid;border-top-color:var(--accent)}
.ssbadge{font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sslink{align-self:flex-start;border-style:dashed}
.swap{background:var(--surface-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.swaptitle{font-size:12.5px;font-weight:700}
.chip small{display:block;font-size:10px;font-weight:600;opacity:.75;letter-spacing:.03em;text-transform:uppercase}
.chip.pref:not(.on){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.fill{align-self:flex-start;border-style:dashed;color:var(--accent)}

/* сессия, баннеры */
.sess{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px}
.sess > span:first-child{flex:1;min-width:0}
.sess.live{border-color:var(--accent);background:var(--accent-soft)}
.sess.live span:nth-child(2){flex:1;font-weight:600}
.sess .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none;animation:pulse 1.4s infinite}
.sess b{font-family:var(--f-num);font-size:16px}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sess .dot{animation:none}}
.banner{display:flex;flex-direction:column;gap:3px;border-radius:12px;padding:10px 12px;background:var(--accent-soft);font-size:13px}
.banner b{font-size:14px}
.banner.deload{background:var(--warm-soft)}
.banner.done{background:var(--good-soft)}
.banner.ss{flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}
.bweek{display:flex;gap:4px;margin-bottom:4px}
.bweek i{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--accent) 20%,transparent)}
.bweek i.past{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.bweek i.now{background:var(--accent)}

/* онбординг и библиотека */
.onb{background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.onb h2{margin:0;font-family:var(--f-display);font-size:18px}
.onb p{margin:0;color:var(--muted);font-size:13.5px}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tcard p{margin:0;font-size:13px;color:var(--muted)}
.thead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.thead b{font-size:15px}
.back{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.b-safe{background:var(--good-soft);color:var(--good)}
.b-care{background:var(--warm-soft);color:var(--warm)}
.b-risky{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.tmeta{font-size:12px;font-weight:600;color:var(--accent)}
.tdays{font-size:12.5px;font-weight:600}
.pweeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pweeks span{background:var(--surface-2);border-radius:8px;padding:6px;font-family:var(--f-num);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:1px}
.pweeks b{font-family:var(--f-body);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pweeks small{font-family:var(--f-body);font-size:10.5px;font-weight:500;color:var(--muted);line-height:1.25}
.preps{font-size:12.5px;color:var(--muted)}
.slot .sname small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}

/* календарь */
.calhead{display:flex;align-items:center;justify-content:space-between}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid.wd span{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cday{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:9px;background:var(--surface-2);font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--muted)}
.cday.has{background:var(--accent);color:var(--accent-ink);cursor:pointer}
.cday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cday.today.has{box-shadow:inset 0 0 0 2px var(--ink)}
.cday:disabled{cursor:default}
.prdot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#f5c542}
.weekrow{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.weekrow div{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.weekrow b{color:var(--ink);font-size:14px}
.ring{width:54px;height:54px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .rbg{stroke:var(--surface-2)}
.ring .rfg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.hrow .meta{font-style:normal;font-size:12px;color:var(--muted);text-align:right}

/* прогресс */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bodymap svg{width:100%;max-width:150px;height:auto}
.bodymap figcaption{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mm-base{fill:var(--surface-2);stroke:var(--line);stroke-width:.6}
.mm{stroke:var(--surface);stroke-width:.6;cursor:pointer;transition:fill .3s}
.mlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.goal{gap:8px}
.gbar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:5px}
.gnums{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.gnums b{color:var(--ink)}
.fc{font-size:13px;color:var(--ink)!important}
.goalform{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.goalform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.goalform input{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-weight:600;width:100%}
.goalform button{grid-column:1/-1}
.plainlist summary{cursor:pointer;font-size:13.5px;font-weight:600}
.plainlist .lines{margin-top:8px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmp{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cname{font-size:13.5px;font-weight:600;min-width:0}
.cname small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.cval{font-family:var(--f-num);font-size:12.5px;color:var(--muted);grid-row:2}
.cval b{color:var(--ink)}
.cdiff{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--muted)}
.cdiff.up{color:var(--good)} .cdiff.down{color:var(--danger)}
.achgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.ach .aic{font-size:26px;filter:grayscale(1);opacity:.35}
.ach b{font-size:12px;line-height:1.2}
.ach small{font-size:10.5px;color:var(--muted);line-height:1.25}
.ach.ok{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:var(--gold-soft)}
.ach.ok .aic{filter:none;opacity:1}
.ach.ok small{color:var(--gold);font-weight:700}
.apb{display:block;width:80%;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:2px}
.apb i{display:block;height:100%;background:var(--accent)}

/* настройки */
.setgrid.four{grid-template-columns:repeat(2,1fr)}

.mline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mline .sel{flex:1;color:var(--ink)}
.exrow .kchip{flex:none}
.exrow > span:first-child{flex:1}
.swatches{display:flex;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw-blue{background:#2457d6}.sw-pink{background:#d6336c}.sw-violet{background:#7c3aed}.sw-green{background:#16a34a}.sw-orange{background:#ea580c}

/* таймер отдыха */
.restbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;pointer-events:none}
.rbin{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);max-width:540px;margin-bottom:6px}
.restbar.done .rbin{background:var(--good);color:#fff}
.rbring{position:relative;width:48px;height:48px;flex:none}
.rbring svg{width:48px;height:48px;transform:rotate(-90deg)}
.rbring circle{fill:none;stroke-width:4}
.rbring .rbg{stroke:color-mix(in srgb,currentColor 20%,transparent)}
.rbring .rfg{stroke:var(--accent);stroke-linecap:round}
.restbar.done .rbring .rfg{stroke:#fff}
.rbring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12.5px;font-weight:600}
.rbinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.rbinfo b{font-size:14px}
.rbinfo span{font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbb{flex:none;border:0;border-radius:9px;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit;font-family:var(--f-num);font-size:12.5px;font-weight:600;padding:8px 7px;min-width:38px}
.rbb.x{font-size:16px;min-width:32px}

/* уведомление */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:30;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;line-height:1.3}
.toast.gold{background:linear-gradient(120deg,#f5c542,#f08c2e);color:#1d1405}
.toast .big{font-size:26px}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}}

/* окна */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}

.mbox{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}

.msub{margin:0;font-size:13px;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.sumgrid small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sumgrid b{font-family:var(--f-num);font-size:19px}
.recs{background:var(--gold-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}

.recs div{display:flex;justify-content:space-between;gap:8px}
.recs div span:last-child{font-family:var(--f-num);font-weight:600}
.recs.ach{background:var(--accent-soft)}
.recs.ach > b{color:var(--accent)}
.cardprev{background:var(--surface-2);border-radius:14px;min-height:200px;display:grid;place-items:center;overflow:hidden}

/* превью программы */

.tday li span{color:var(--muted)}

.vol{gap:12px}

.vst{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.s-low{background:var(--surface-2);color:var(--muted)}
.s-ok{background:var(--warm-soft);color:var(--warm)}

.vind{font-size:11px;color:var(--muted)}
.vinfo summary{cursor:pointer;font-size:13px;font-weight:600}
.vinfo p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}

.vol > .linkbtn{align-self:flex-start;padding:0}

function migrate(cfg){
  if(!cfg||!cfg.groups)return defaultConfig();
  cfg=clone(cfg);
  if(!(cfg.version>=2&&cfg.programs)){
    var old=cfg.groups.slice();
    var fullSlots=old.filter(function(g){return !g.archived;}).map(function(g){return {gid:g.id,count:g.multi>0?g.multi:1};});
    old.forEach(function(g){delete g.multi;});
    cfg.groups=old;
    var progs=clone(DEFAULT_PROGRAMS);progs[0].slots=fullSlots;
    cfg.programs=progs;cfg.lastProgram="p_full";
  }

  return fillDefaults(cfg);
}
function fillDefaults(cfg){
  var defG={},defE={};
  DEFAULT_GROUPS.forEach(function(g){defG[g.id]=g;g.ex.forEach(function(e){defE[e.id]=e;});});
  DEFAULT_GROUPS.forEach(function(dg){if(!cfg.groups.some(function(g){return g.id===dg.id;}))cfg.groups.push(clone(dg));});
  cfg.groups.forEach(function(g){
    if(g.muscle===undefined)g.muscle=defG[g.id]?defG[g.id].muscle:null;
    g.ex.forEach(function(e){
      var d=defE[e.id];
      if(!e.kind)e.kind=d?d.kind:"mid";
      if(e.muscle===undefined&&d&&d.muscle)e.muscle=d.muscle;
      if(e.backRisk===undefined&&d&&d.backRisk)e.backRisk=true;

  });

  if(!(s.weekGoal>0))s.weekGoal=2;if(!s.accent)s.accent="blue";if(!s.theme)s.theme="auto";

  cfg.restLearn=cfg.restLearn||{};
  if(cfg.seenAch===undefined)cfg.seenAch=null;

}

function fmtDateLong(iso){return dateObj(iso).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}).replace(" г.","");}
function fmtNum(n){if(n===null||n===undefined||n==="")return "";return String(Math.round(n*100)/100).replace(".",",");}
function fmtBig(n){return Math.round(n).toLocaleString("ru-RU").replace(/,/g," ");}
function fmtDur(ms){var m=Math.max(0,Math.round(ms/60000));var h=Math.floor(m/60);return h?h+" ч "+pad(m%60)+" мин":m+" мин";}
function fmtClock(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):m)+":"+pad(s);}
function parseNum(s){s=String(s).trim().replace(",",".");if(s==="")return null;var n=parseFloat(s);return isFinite(n)?n:null;}

var LS_KEY = "trenlog.v1";
var store = {
  col:null, chains:{},
  loadLocal:function(){
    try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);if(d.config&&d.config.groups)state.config=migrate(d.config);state.workouts=d.workouts||{};}}catch(e){}
  },
  saveLocal:function(){try{localStorage.setItem(LS_KEY,JSON.stringify({config:state.config,workouts:state.workouts}));}catch(e){}},
  write:function(key,fn){var prev=store.chains[key]||Promise.resolve();var next=prev.then(fn,fn);store.chains[key]=next.catch(function(){});return next;},
  saveConfig:function(){
    if(store.col){setStatus("saving");return store.write("config",function(){return store.col.doc("config").set({kind:"config",config:clone(state.config)});}).then(function(){setStatus("ok");},onWriteErr);}
    store.saveLocal();setStatus("ok");return Promise.resolve();
  },
  saveWorkout:function(w){
    var id="w_"+w.date;
    if(store.col){setStatus("saving");return store.write(id,function(){
      if(!w.entries.length)return store.col.doc(id).delete();
      var body=clone(w);body.kind="workout";return store.col.doc(id).set(body);
    }).then(function(){setStatus("ok");},onWriteErr);}
    store.saveLocal();setStatus("ok");return Promise.resolve();
  },
  replaceAll:function(){
    if(!store.col){store.saveLocal();return Promise.resolve();}
    var self=this;
    return store.col.get().then(function(snap){
      var keep={};Object.keys(state.workouts).forEach(function(d){keep["w_"+d]=true;});
      return Promise.all(snap.docs.filter(function(d){return d.id!=="config"&&!keep[d.id];}).map(function(d){return store.col.doc(d.id).delete();}));
    }).then(function(){
      var p=self.saveConfig();
      Object.keys(state.workouts).forEach(function(d){p=p.then(function(){return self.saveWorkout(state.workouts[d]);});});
      return p;
    });
  }
};

function program(id){return state.config.programs.filter(function(p){return p.id===id;})[0]||null;}
function findEx(id){var gs=groups();for(var i=0;i<gs.length;i++){for(var j=0;j<gs[i].ex.length;j++){if(gs[i].ex[j].id===id)return {g:gs[i],e:gs[i].ex[j]};}}return null;}

function doneEntries(w){return (w.entries||[]).filter(function(en){return workSets(en).length>0;});}

function better(a,b){if(!b)return true;if(!a)return false;return a.w>b.w||(a.w===b.w&&a.r>b.r);}

function lastSession(exId,before){
  var ds=sortedDates();
  for(var i=ds.length-1;i>=0;i--){
    if(ds[i]>=before)continue;
    var w=state.workouts[ds[i]];
    for(var j=0;j<w.entries.length;j++){var en=w.entries[j];if(en.exId===exId&&workSets(en).length)return {date:ds[i],entry:en};}
  }
  return null;
}
function bestBefore(exId,before){
  var best=null;
  sortedDates().forEach(function(d){if(d>=before)return;state.workouts[d].entries.forEach(function(en){if(en.exId!==exId)return;workSets(en).forEach(function(s){var c={w:s.w||0,r:s.r};if(better(c,best))best=c;});});});
  return best;
}
function workoutRecords(w){
  var out=[];
  doneEntries(w).forEach(function(en){
    var prev=bestBefore(en.exId,w.date);if(!prev)return;
    var top=null;workSets(en).forEach(function(s){var c={w:s.w||0,r:s.r};if(better(c,top))top=c;});
    if(better(top,prev)&&(top.w!==prev.w||top.r!==prev.r))out.push({exId:en.exId,w:top.w,r:top.r,prev:prev});
  });
  return out;
}
function tonnage(w){var t=0;(w.entries||[]).forEach(function(en){workSets(en).forEach(function(s){t+=(s.w||0)*s.r;});});return t;}
function setsCount(w){var n=0;(w.entries||[]).forEach(function(en){n+=workSets(en).length;});return n;}
function workoutDuration(w){
  if(!w.startedAt)return null;
  var end=w.finishedAt||w.lastAt;if(!end||end<=w.startedAt)return null;
  return end-w.startedAt;
}
function stepFor(w){return w<10?1:2.5;}
function roundW(w){var st=stepFor(w);return Math.round(w/st)*st;}
function recommend(exId,date){
  var last=lastSession(exId,date);
  var R=curReps();
  if(!last)return {type:"new",R:R};
  var ws=workSets(last.entry);
  var top=Math.max.apply(null,ws.map(function(s){return s.w||0;}));
  var allTop=ws.every(function(s){return s.r>=R.hi;});
  var res;
  if(top<=0)res={type:allTop?"up":"hold",w:0,bw:true,last:last};
  else if(allTop)res={type:"up",w:Math.round((top+stepFor(top))*100)/100,last:last};
  else res={type:"hold",w:top,last:last};
  if(R.load<1&&res.w>0){res.type="deload";res.w=roundW(res.w*R.load);}
  res.R=R;
  return res;
}
function setsText(entry){

  if(sameW)return (ws[0].w?fmtNum(ws[0].w)+" кг × ":"")+ws.map(function(s){return s.r;}).join(", ");

  if(!ds.length){var lp=state.config.lastProgram;return (lp&&program(lp)&&!program(lp).archived)?lp:ps[0].id;}

/* Установка шаблона: возвращаем удалённые упражнения и группы, если они нужны программе */
function ensureEx(gid,exId){
  var g=group(gid);
  var dg=DEFAULT_GROUPS.filter(function(x){return x.id===gid;})[0];
  if(!g){if(!dg)return false;g=clone(dg);g.ex=[];state.config.groups.push(g);}
  if(g.archived)g.archived=false;
  var e=g.ex.filter(function(x){return x.id===exId;})[0];
  if(e){if(e.archived)e.archived=false;return true;}
  var de=dg&&dg.ex.filter(function(x){return x.id===exId;})[0];
  if(!de)return false;
  g.ex.push(clone(de));return true;
}
function installTemplate(tid,replace){
  var t=TEMPLATES.filter(function(x){return x.id===tid;})[0];if(!t)return;
  if(replace)state.config.programs.forEach(function(p){p.archived=true;});
  var existingNames={};programs().forEach(function(p){existingNames[p.name]=true;});
  var firstId=null;
  t.programs.forEach(function(tp){
    var slots=[];
    tp.slots.forEach(function(s){
      var pref=(s[2]||[]).filter(function(exId){return ensureEx(s[0],exId);});
      if(!group(s[0]))return;
      slots.push({gid:s[0],count:s[1]||1,pref:pref});
    });
    var name=tp.name;if(existingNames[name])name=tp.name+" · "+t.name.split(" ")[0];
    var p={id:uid("p"),name:name,slots:slots,from:t.id};
    if(tp.reps)p.reps=clone(tp.reps);
    state.config.programs.push(p);
    if(!firstId)firstId=p.id;
  });
  state.config.lastProgram=firstId;
  state.config.onboarded=true;
  return firstId;
}

function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  var dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;
  var x=c.getContext("2d");x.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement);
  var cols=[cs.getPropertyValue("--accent"),"#f2b705","#e5484d","#30a46c","#8e4ec6","#ffffff"].map(function(s){return s.trim()||"#f2b705";});
  var ps=[];for(var i=0;i<140;i++)ps.push({x:W/2+(Math.random()-0.5)*80,y:H*0.35,vx:(Math.random()-0.5)*13,vy:-Math.random()*13-4,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-0.5)*0.4,c:cols[i%cols.length]});
  var t0=performance.now();
  (function f(now){var el=(now-t0)/1000;x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.vy+=0.38;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/2.2);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(el<2.3)requestAnimationFrame(f);else c.remove();})(t0);
}

var rest={endAt:0,total:0,running:false,done:false,label:"",timer:null,hideAt:0};
function suggestedRest(exId,set){
  var R=curReps();
  var learned=state.config.restLearn[exId];
  var base=learned||KINDS[exKind(exId)].rest;
  var why="";
  if(set&&set.r>0){
    if(set.r<R.lo){base+=30;why="тяжёлый подход +30 с";}
    else if(set.r>R.hi){base-=15;why="легко −15 с";}
  }
  if(R.load<1)base=Math.min(base,90);
  base=Math.max(30,Math.min(300,Math.round(base/5)*5));
  return {sec:base,why:why,learned:!!learned};
}
function learnRest(exId,en,i){
  if(i<1)return;
  var a=en.sets[i-1],b=en.sets[i];
  if(!a||!b||!a.t||!b.t)return;
  var actual=(b.t-a.t)/1000-35;
  if(actual<20||actual>420)return;
  var cur=state.config.restLearn[exId]||KINDS[exKind(exId)].rest;
  state.config.restLearn[exId]=Math.round((cur*0.7+actual*0.3)/5)*5;
  state.cfgDirty=true;
}
function startRest(sec,label){
  rest.total=sec;rest.endAt=Date.now()+sec*1000;rest.running=true;rest.done=false;rest.label=label;rest.hideAt=0;
  unlockAudio();renderRest();
  clearInterval(rest.timer);rest.timer=setInterval(tickRest,250);
}
function stopRest(){rest.running=false;rest.done=false;clearInterval(rest.timer);document.getElementById("restbar").hidden=true;document.body.classList.remove("has-rest");}
function tickRest(){
  if(!rest.running)return;
  var left=(rest.endAt-Date.now())/1000;
  if(left<=0&&!rest.done){rest.done=true;rest.hideAt=Date.now()+45000;buzz([350,150,350,150,500]);beep();}
  if(rest.done&&Date.now()>rest.hideAt){stopRest();return;}
  renderRest();
}
function renderRest(){
  var bar=document.getElementById("restbar");bar.hidden=false;document.body.classList.add("has-rest");
  var left=Math.max(0,(rest.endAt-Date.now())/1000);
  var frac=rest.total?left/rest.total:0;
  bar.classList.toggle("done",rest.done);
  document.getElementById("rbTime").textContent=rest.done?"0:00":fmtClock(Math.ceil(left));
  document.getElementById("rbTitle").textContent=rest.done?"Пора! Следующий подход":"Отдых";
  document.getElementById("rbWhat").textContent=rest.label;
  var c=document.getElementById("rbArc");var L=2*Math.PI*20;c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-frac);
}

function weekStats(){
  var goal=settings().weekGoal;var counts={};
  sortedDates().forEach(function(d){if(isWorkoutDone(state.workouts[d])){var k=mondayOf(d);counts[k]=(counts[k]||0)+1;}});
  var keys=Object.keys(counts).sort();
  var thisWeek=mondayOf(todayIso());
  var res={goal:goal,thisWeek:counts[thisWeek]||0,current:0,max:0};
  if(!keys.length)return res;
  var run=0,w=keys[0];
  while(w<=thisWeek){
    var n=counts[w]||0;
    if(n>=goal){run++;if(run>res.max)res.max=run;}
    else if(w!==thisWeek)run=0;
    w=shiftIso(w,7);
  }
  res.current=run;
  return res;
}

/* ---------- история упражнения, прогноз, сравнение ---------- */
function exHistory(exId){
  var out=[];
  sortedDates().forEach(function(d){
    state.workouts[d].entries.forEach(function(en){
      if(en.exId!==exId)return;var t=entryTop(en);if(!t)return;
      out.push({date:d,entry:en,top:t.w,reps:t.r});
    });
  });

}
function forecast(exId,goalW){
  var h=exHistory(exId).slice(-8);if(h.length<3)return null;
  var x0=h[0].date;var xs=h.map(function(p){return daysBetween(x0,p.date);}),ys=h.map(function(p){return p.top;});
  var n=xs.length,mx=xs.reduce(function(a,b){return a+b;})/n,my=ys.reduce(function(a,b){return a+b;})/n;
  var num=0,den=0;for(var i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)*(xs[i]-mx);}
  if(!den)return null;var slope=num/den;if(slope<=0.005)return {slope:slope,date:null};
  var cur=ys[n-1];var days=Math.ceil((goalW-cur)/slope);
  return {slope:slope,date:shiftIso(todayIso(),Math.max(0,days))};
}
function comparison(months){
  var cut=shiftIso(todayIso(),-Math.round(months*30.4));
  var rows=[];
  groups().forEach(function(g){g.ex.forEach(function(e){
    var h=exHistory(e.id);if(h.length<2)return;
    var base=null;for(var i=h.length-1;i>=0;i--){if(h[i].date<=cut){base=h[i];break;}}
    var since=false;if(!base){base=h[0];since=true;}
    var now=h[h.length-1];if(now.date===base.date)return;
    var bw=h.every(function(p){return p.top<=0;});
    var a=bw?base.reps:base.top,b=bw?now.reps:now.top;
    rows.push({exId:e.id,from:a,to:b,unit:bw?"раз":"кг",diff:b-a,pct:a>0?Math.round((b-a)/a*100):0,since:since,fromDate:base.date});
  });});
  rows.sort(function(x,y){return y.pct-x.pct||y.diff-x.diff;});

}

var saveTimer=null;
function loadDraft(){
  var w=state.workouts[state.date];
  state.draft=w?clone(w):{date:state.date,entries:[]};
  state.draft.entries.forEach(function(en){en.sets=(en.sets||[]).filter(function(s){return !s.wu;});});
  var p=state.draft.programId&&program(state.draft.programId);
  if(!p||p.archived)state.draft.programId=nextProgramId(state.date);
  state.dirty=0;state.swap=null;state.ssPick=null;state.editNote=null;
}
function touch(){state.dirty++;clearTimeout(saveTimer);setStatus("saving");saveTimer=setTimeout(flush,700);}
function flush(){
  clearTimeout(saveTimer);saveTimer=null;
  if(state.dirty){
    var mark=state.dirty;var w=clone(state.draft);
    if(w.entries.length)state.workouts[w.date]=w;else delete state.workouts[w.date];
    store.saveWorkout(w).then(function(){if(state.dirty===mark)state.dirty=0;});
    checkGoals();checkAchievements(false);
  }
  if(state.cfgDirty){state.cfgDirty=false;store.saveConfig();}
}

/* ---------- прогресс ---------- */
function chartSvg(pts,useReps,goalW){
  var W=340,H=170,L=34,R=12,T=14,B=26;
  var vals=pts.map(function(p){return useReps?p.reps:p.top;});
  var all=vals.slice();if(goalW&&!useReps)all.push(goalW);
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  if(mn===mx){mn=Math.max(0,mn-2);mx=mx+2;}
  var span=mx-mn;mn=Math.max(0,mn-span*0.1);mx=mx+span*0.1;
  function x(i){return pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);}
  function y(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График прогресса">';
  for(var k=0;k<3;k++){var v=mn+(mx-mn)*k/2;var yy=y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+fmtNum(Math.round(v*10)/10)+'</text>';}
  if(goalW&&!useReps){var gy=y(goalW);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" fill="var(--good)">цель '+fmtNum(goalW)+'</text>';}
  var path=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(vals[i]).toFixed(1);}).join(" ");
  if(pts.length>1){
    s+='<path d="'+path+" L"+x(pts.length-1).toFixed(1)+" "+(H-B)+" L"+x(0).toFixed(1)+" "+(H-B)+' Z" fill="var(--accent-soft)" stroke="none"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){var last=i===pts.length-1;
    s+='<circle cx="'+x(i)+'" cy="'+y(vals[i])+'" r="'+(last?5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';});
  s+='<text x="'+x(0)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?'middle':'start')+'" font-size="10" fill="var(--muted)">'+fmtDate(pts[0].date)+'</text>';
  if(pts.length>1)s+='<text x="'+x(pts.length-1)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtDate(pts[pts.length-1].date)+'</text>';
  return s+'</svg>';
}
function goalCardHtml(exId,hist,useReps){

function openCard(date,keepSeed){
  var w=date===state.date?state.draft:state.workouts[date];if(!w)return;
  if(!keepSeed)state.cardSeed=Math.floor(Math.random()*1e9);
  var keepScroll=state.modal&&state.modal.type==="card";
  openModal({type:"card",date:date,url:keepScroll&&state.modal.url||null});
  cardFonts().then(function(){var c=drawCard(w,{seed:state.cardSeed,format:state.cardFormat});state.cardCanvas=c;if(state.modal&&state.modal.type==="card"){state.modal.url=c.toDataURL("image/png");renderModal();}});
}

/* ---------- резервная копия ---------- */
function backupData(){return {app:"dnevnik-zala",version:3,exported:new Date().toISOString(),config:state.config,workouts:state.workouts};}
function prepareImport(text){
  var d=null;try{d=JSON.parse(String(text).trim());}catch(e){}
  if(!d||!d.config||!d.config.groups||typeof d.workouts!=="object"){state.msg={ok:false,text:"Не получилось прочитать копию. Проверь, что это данные из «Дневника зала»."};state.pendingImport=null;}
  else{state.pendingImport={config:migrate(d.config),workouts:d.workouts||{}};state.msg=null;}
  rerender(renderSettings);
}
function copyData(){
  flush();
  var text=JSON.stringify(backupData());
  var done=function(){state.msg={ok:true,text:"Скопировано ✓ Сохрани текст в заметках или отправь себе в мессенджер"};rerender(renderSettings);};
  var fallback=function(){
    var ta=document.getElementById("importText");var det=ta&&ta.closest("details");
    if(det)det.open=true;if(ta){ta.value=text;ta.focus();ta.select();}
    var m=document.getElementById("backupMsg");if(m){m.className="msg ok";m.textContent="Текст выделен — скопируй его";}
  };
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}
function doExport(){
  flush();
  var name="dnevnik-zala-"+todayIso()+".json";
  var blob=new Blob([JSON.stringify(backupData())],{type:"application/json"});
  try{var file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Дневник зала — копия"}).then(function(){state.msg={ok:true,text:"Копия сохранена"};rerender(renderSettings);},function(){});return;}
  }catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  state.msg={ok:true,text:"Файл "+name+" сохранён в загрузки"};rerender(renderSettings);
}

document.addEventListener("click",function(e){
  var mm=e.target.closest&&e.target.closest(".mm");
  if(mm){var m=mm.dataset.m;var n=muscleLoad(7)[m]||0;var info=document.getElementById("mmInfo");if(info)info.textContent=MUSCLES[m]+": "+(n?n+" "+plural(n,"подход","подхода","подходов")+" за неделю":"не было за неделю");return;}
  var b=e.target.closest&&e.target.closest("[data-act]");if(!b||b.disabled)return;
  if(b.closest(".tabs"))return;
  var act=b.dataset.act,gid=b.dataset.g,exId=b.dataset.e,id=b.dataset.id;
  var ents=state.draft.entries;
  switch(act){
  case "prog":
    state.draft.programId=b.dataset.p;state.config.lastProgram=b.dataset.p;
    if(ents.length)touch();store.saveConfig();rerender(renderWorkout);break;
  case "pick":{
    var count=+b.dataset.c||1;
    var idx=-1;ents.forEach(function(en,i){if(en.gid===gid&&en.exId===exId)idx=i;});
    if(idx>=0)ents.splice(idx,1);
    else if(count>1){if(ents.filter(function(en){return en.gid===gid;}).length>=count){toast("В этой группе уже "+count+" "+plural(count,"упражнение","упражнения","упражнений")+" — сними одно, чтобы выбрать другое");return;}ents.push(newEntry(gid,exId));}
    else{state.draft.entries=ents.filter(function(en){return en.gid!==gid;});state.draft.entries.push(newEntry(gid,exId));}
    touch();rerender(renderWorkout);break;}
  case "fill":
    currentSlots().forEach(function(s){
      if(!s.pref||!s.pref.length)return;
      if(state.draft.entries.some(function(en){return en.gid===s.gid;}))return;
      s.pref.filter(function(x){var f=findEx(x);return f&&!f.e.archived;}).slice(0,s.count).forEach(function(x){state.draft.entries.push(newEntry(s.gid,x));});
    });
    touch();rerender(renderWorkout);break;
  case "addset":case "delset":{
    var en=findEntry(gid,exId);if(!en)return;
    if(act==="addset"){var lw=en.sets.length?en.sets[en.sets.length-1].w:null;en.sets.push({w:lw,r:null});}
    else en.sets.splice(+b.dataset.i,1);
    touch();rerender(renderWorkout);break;}
  case "wminus":case "wplus":{
    var en2=findEntry(gid,exId);if(!en2)return;var i=+b.dataset.i;var s=en2.sets[i];var old=s.w||0;
    var st=act==="wplus"?stepFor(old):stepFor(Math.max(0,old-0.01));
    var nw=Math.max(0,Math.round((old+(act==="wplus"?st:-st))*100)/100);
    s.w=nw||null;
    for(var j=i+1;j<en2.sets.length;j++){var sj=en2.sets[j];if(!(sj.r>0)&&(sj.w||0)===old)sj.w=s.w;}
    en2.sets.forEach(function(sx,k){var inp=document.getElementById("w-"+exId+"-"+k);if(inp)inp.value=fmtNum(sx.w);});
    touch();break;}
  case "note":
    state.editNote=exId;rerender(renderWorkout);
    var ni=document.getElementById("note-"+exId);if(ni){ni.focus();ni.select();}break;
  case "noteok":{var inp2=document.querySelector("[data-note]");if(inp2)saveNote(inp2.dataset.note,inp2.value);break;}
  case "kind":{var f=findEx(exId);if(!f)return;var k=KIND_ORDER.indexOf(f.e.kind);f.e.kind=KIND_ORDER[(k+1)%KIND_ORDER.length];delete state.config.restLearn[exId];saveCfg(renderSettings);break;}

  case "sspick":state.ssPick=state.ssPick===gid+"|"+exId?null:gid+"|"+exId;rerender(renderWorkout);break;

    });break;}
  case "cardfmt":state.cardFormat=b.dataset.f;openCard(state.modal.date,true);break;

    if(state.draft.programId===id)state.draft.programId=state.config.lastProgram;saveCfg(renderSettings);break;}
  case "cnt":{var p2=program(b.dataset.p);var sl=p2.slots[+b.dataset.i];sl.count=Math.max(1,Math.min(5,sl.count+(+b.dataset.d)));saveCfg(renderSettings);break;}
  case "mv":{var p3=program(b.dataset.p);var a1=+b.dataset.i,a2=a1+(+b.dataset.d);if(a2<0||a2>=p3.slots.length)return;var t=p3.slots[a1];p3.slots[a1]=p3.slots[a2];p3.slots[a2]=t;saveCfg(renderSettings);break;}
  case "rmslot":{var p4=program(b.dataset.p);p4.slots.splice(+b.dataset.i,1);saveCfg(renderSettings);break;}
  case "allmuscles":state.showAllMuscles=!state.showAllMuscles;rerender(renderProgress);break;
  case "cmp":state.cmpMonths=+b.dataset.m;rerender(renderProgress);break;
  case "progto":state.progEx=exId;renderProgress();var ps=document.getElementById("progSel");if(ps)ps.scrollIntoView({block:"center"});break;
  case "goaledit":state.editGoal=exId;rerender(renderProgress);break;
  case "goaldel":delete state.config.goals[exId];state.editGoal=null;saveCfg(renderProgress);break;
  case "accent":settings().accent=b.dataset.a;applyLook();saveCfg(renderSettings);break;
  case "theme":settings().theme=b.dataset.th;applyLook();saveCfg(renderSettings);break;
  case "export":doExport();break;
  case "copyData":copyData();break;
  case "importText":{var ta=document.getElementById("importText");if(ta&&ta.value.trim())prepareImport(ta.value);break;}
  case "importNo":state.pendingImport=null;rerender(renderSettings);break;
  case "importYes":
    if(!state.pendingImport)return;
    clearTimeout(saveTimer);saveTimer=null;
    state.config=clone(state.pendingImport.config);state.workouts=clone(state.pendingImport.workouts);
    state.pendingImport=null;applyLook();loadDraft();store.replaceAll();
    state.msg={ok:true,text:"Данные загружены: тренировок "+Object.keys(state.workouts).length};rerender(renderSettings);break;
  }
});
function ensureSessBar(){
  if(!state.draft.startedAt||document.querySelector(".sess"))return;
  var sum=view.querySelector(".summary");if(!sum)return;
  sum.insertAdjacentHTML("beforebegin",sessionHtml());
}
function saveNote(exId,val){var f=findEx(exId);if(f){var v=String(val).trim();if(v)f.e.note=v;else delete f.e.note;}state.editNote=null;store.saveConfig();rerender(renderWorkout);}
function finishWorkout(){
  var w=state.draft;
  if(!w.startedAt){var ts=[];w.entries.forEach(function(en){en.sets.forEach(function(s){if(s.t)ts.push(s.t);});});if(ts.length){w.startedAt=Math.min.apply(null,ts);w.lastAt=Math.max.apply(null,ts);}}
  w.finishedAt=w.date===todayIso()?Date.now():(w.lastAt||null);
  state.dirty++;
  state.workouts[w.date]=clone(w);
  var fresh=checkAchievements(true);
  flush();stopRest();keepAwake(false);
  if(workoutRecords(w).length||fresh.length)confetti();
  openModal({type:"summary",date:w.date,fresh:true,ach:fresh});
  rerender(renderWorkout);
}
/* Подход записан: время, рекорд, отдых */
function onSetLogged(en,i){
  var s=en.sets[i];var w=state.draft;
  if(w.date===todayIso()){
    if(!s.t)s.t=Date.now();
    if(!w.startedAt)w.startedAt=s.t;
    w.lastAt=Date.now();
    if(w.finishedAt)delete w.finishedAt;
    learnRest(en.exId,en,i);
  }
  /* рекорд */
  var prev=bestBefore(en.exId,w.date);
  w.prs=w.prs||{};
  var cand={w:s.w||0,r:s.r};var bar=w.prs[en.exId]&&better(w.prs[en.exId],prev)?w.prs[en.exId]:prev;
  if(prev&&better(cand,bar)&&(cand.w!==bar.w||cand.r!==bar.r)){
    w.prs[en.exId]=cand;confetti();buzz([60,40,60]);
    toast('<span class="big">🏆</span><span><b>Новый рекорд!</b><br>'+esc(exName(en.exId))+' — '+(cand.w?fmtNum(cand.w)+' кг × ':'')+cand.r+'</span>',"gold");
  }
  /* отдых */
  if(w.date!==todayIso())return;
  var partner=partnerOf(en);
  if(partner){
    var pi=partner.sets[i];
    if(pi&&!(pi.r>0)){
      stopRest();toast("Теперь «"+esc(exName(partner.exId))+"», подход "+(i+1));
      var target=view.querySelector('[data-entry="'+entryKey(partner).replace(/"/g,'\\"')+'"]');if(target)target.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    var r1=suggestedRest(en.exId,s),r2=suggestedRest(partner.exId,partner.sets[i]||s);
    startRest(Math.max(r1.sec,r2.sec),"Суперсет · после "+(i+1)+"-го круга");return;
  }
  var allDone=en.sets.every(function(x){return x.r>0;});
  var r=suggestedRest(en.exId,s);
  startRest(r.sec,exName(en.exId)+(allDone?" · упражнение готово":" · после "+(i+1)+"-го подхода")+(r.why?" ("+r.why+")":""));
}
view.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  var en=findEntry(t.dataset.g,t.dataset.e);if(!en)return;
  var s=en.sets[+t.dataset.i];if(!s)return;
  var v=parseNum(t.value);
  if(t.dataset.f==="r")s.r=v===null?null:Math.round(v);else s.w=v;
  touch();updateSummary();
});
view.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f==="r"){
    var en=findEntry(t.dataset.g,t.dataset.e);if(!en)return;var i=+t.dataset.i;
    var row=t.closest(".set");if(row)row.classList.toggle("logged",en.sets[i].r>0);
    if(en.sets[i].r>0){onSetLogged(en,i);touch();ensureSessBar();}
    return;
  }
  if(t.dataset&&t.dataset.note){saveNote(t.dataset.note,t.value);return;}
  if(t.id==="progSel"){state.progEx=t.value;state.editGoal=null;renderProgress();}
  else if(t.dataset.ren){
    var name=t.value.trim();var obj=t.dataset.ren==="p"?program(t.dataset.id):group(t.dataset.id);
    if(!obj)return;if(!name){t.value=obj.name;return;}obj.name=name;store.saveConfig();
  }
  else if(t.dataset.addslot){if(!t.value)return;program(t.dataset.addslot).slots.push({gid:t.value,count:1});saveCfg(renderSettings);}
  else if(t.dataset.gmuscle){var g=group(t.dataset.gmuscle);g.muscle=t.value||null;store.saveConfig();}
  else if(["setRepLo","setRepHi","setSets","setWeek"].indexOf(t.id)>=0){
    var lo=parseInt(document.getElementById("setRepLo").value,10),hi=parseInt(document.getElementById("setRepHi").value,10),st=parseInt(document.getElementById("setSets").value,10),wk=parseInt(document.getElementById("setWeek").value,10);
    var s=settings();s.repLo=lo>0?lo:10;s.repHi=hi>=s.repLo?hi:s.repLo;s.sets=st>0?Math.min(st,10):3;s.weekGoal=wk>0?Math.min(wk,7):2;
    saveCfg(renderSettings);
  }
  else if(t.id==="importFile"&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){prepareImport(rd.result);};rd.readAsText(t.files[0]);}
});
view.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;var t=e.target;
  if(t.dataset&&(t.dataset.ren||t.dataset.f==="r"||t.dataset.note)){e.preventDefault();t.blur();}
});
view.addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.gd){if(d.open)state.openGroup=d.dataset.gd;else if(state.openGroup===d.dataset.gd)state.openGroup=null;}},true);
view.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.dataset.form==="goal"){
    var gw=parseNum(document.getElementById("goalW").value);if(!(gw>0))return;
    var by=document.getElementById("goalD").value||null;var h=exHistory(f.dataset.e);var cur=h.length?h[h.length-1].top:0;
    var old=state.config.goals[f.dataset.e];
    state.config.goals[f.dataset.e]={w:gw,by:by,startW:old&&!old.doneAt&&old.startW<gw?old.startW:cur,setAt:todayIso()};
    state.editGoal=null;saveCfg(renderProgress);return;
  }
  var inp=f.querySelector("input");var name=inp.value.trim();if(!name)return;
  if(f.dataset.form==="ex"){group(f.dataset.g).ex.push({id:uid("x"),name:name,kind:"mid"});state.openGroup=f.dataset.g;saveCfg(renderSettings);var a=document.getElementById("add-"+f.dataset.g);if(a)a.focus();}
  else if(f.dataset.form==="group"){var ng={id:uid("g"),name:name,muscle:null,ex:[]};state.config.groups.push(ng);state.openGroup=ng.id;saveCfg(renderSettings);var a2=document.getElementById("add-"+ng.id);if(a2)a2.focus();}
  else if(f.dataset.form==="prog"){var np={id:uid("p"),name:name,slots:[]};state.config.programs.push(np);saveCfg(renderSettings);var s2=document.getElementById("add-slot-"+np.id);if(s2)s2.focus();}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.modal)closeModal();});

/* ---------- запуск ---------- */
store.loadLocal();
applyLook();
loadDraft();
checkAchievements(true);
render();
setStatus("ok");
startSessionTicker();
if(sessionActive(state.draft))keepAwake(true);

function applySnapshot(snap){
  var ws={},c=null;
  snap.docs.forEach(function(d){var v=d.data();if(!v)return;
    if(d.id==="config"&&v.config&&v.config.groups)c=v.config;
    else if(v.kind==="workout"&&v.date){var w=clone(v);delete w.kind;w.entries=w.entries||[];ws[v.date]=w;}});
  var needSave=false;
  if(c){needSave=!(c.version>=3);state.config=migrate(c);}
  if(state.dirty&&state.draft&&state.draft.entries.length)ws[state.date]=clone(state.draft);
  state.workouts=ws;applyLook();
  var ae=document.activeElement;
  var typing=ae&&(view.contains(ae)||document.getElementById("modal").contains(ae))&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT");
  if(!state.dirty&&!saveTimer)loadDraft();
  if(state.config.seenAch===null)checkAchievements(true);
  if(!typing)rerender(render);
  if(needSave)store.saveConfig();
}
if(IS_ARTIFACT&&window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      store.col=db.collection("data/users/"+id);state.mode="db";setStatus("ok");
      store.col.onSnapshot(applySnapshot,function(){store.col=null;state.mode="local";setStatus("err","Нет связи — сохраняю на устройстве");});
    });
  }).catch(function(){});
}
if(!IS_ARTIFACT){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.Capacitor){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
  }
}

})();
</script>
